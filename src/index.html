<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <script type="module" src="index.js" defer></script>
</head>
<body>
    <nav>
        <h1>Weather Channel</h1>
        <button class="Location">Location</button>
    </nav>
    <main>
        <h2 class="forecast">Forecast</h2>
        <div class="container">
            <h3>Location</h3>
            <div class="card-container">
                <div class="card">
                    <h4 class="">Monday</h4>
                    <img class="mon-img">
                    <p class="">Min</p>
                    <p class="">Max</p>
                </div>
                <div class="card">
                    <h4>Tuesday</h4>
                    <img class="tue-img">
                    <p class="temp-min">Min</p>
                    <p class="temp-max">Max</p>
                </div>
                <div class="card">
                    <h4>Wednesday</h4>
                    <img class="wed-img">
                    <p class="temp-min">Min</p>
                    <p class="temp-max">Max</p>
                </div>
                <div class="card">
                    <h4>Thursday</h4>
                    <img class="thu-img">
                    <p class="temp-min">Min</p>
                    <p class="temp-max">Max</p>
                </div>
                <div class="card">
                    <h4>Friday</h4>
                    <img class="fri-img">
                    <p class="temp-min">Min</p>
                    <p class="temp-max">Max</p>
                </div>
                <div class="card">
                    <h4>Saturday</h4>
                    <img class="sat-img">
                    <p class="temp-min">Min</p>
                    <p class="temp-max">Max</p>
                </div>
                <div class="card">
                    <h4>Sunday</h4>
                    <img class="sun-img">
                    <p class="temp-min">Min</p>
                    <p class="temp-max">Max</p>
                </div>
            </div>
            <h4>Current Weather</h4>
            <div class="current-weather">
            </div>
        </div>
    
    </main>
</body>
</html>
